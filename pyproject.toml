[project]
name = "kindle-ha-dash"
version = "0.1.0"
requires-python = "==3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.11.0",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.14.4",
  "mypy==1.19.1",
  "types-Pillow>=10.2",
]

# The latest published plugin still pins HA 2026.10.4. Run its fixtures against
# the actual target rather than silently testing the wrong Home Assistant.
[tool.uv]
override-dependencies = ["homeassistant==2026.11.0"]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q -p no:homeassistant -p no:respx"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["kindle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true
files = ["custom_components/kindle_dash", "tools/preview.py"]
